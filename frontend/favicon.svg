<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0f9b9d" />
    </linearGradient>
    <linearGradient id="vialGrad" x1="24" y1="20" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0f9b9d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0c4a6e" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Shield Background -->
  <path d="M32 4 C44 4 54 10 54 14 C54 36 43 51 32 59 C21 51 10 36 10 14 C10 10 20 4 32 4 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />
  
  <!-- Inner Shield Rim -->
  <path d="M32 7 C42 7 51 12 51 15 C51 34 41 48 32 55 C23 48 13 34 13 15 C13 12 22 7 32 7 Z" 
        stroke="rgba(255,255,255,0.22)" 
        stroke-width="1.5" 
        fill="none" />

  <!-- Vaccine Vial / Cold-chain Core -->
  <!-- Vial Cap -->
  <rect x="27" y="16" width="10" height="3.5" rx="1.5" fill="#ffffff" opacity="0.9" />
  <rect x="29" y="19.5" width="6" height="2.5" fill="#ffffff" opacity="0.75" />
  
  <!-- Vial Body -->
  <rect x="24" y="22" width="16" height="25" rx="5" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="1.8" />
  
  <!-- Liquid Level -->
  <path d="M25 32 C27 30.5 31 33.5 34 32 C37 30.5 39 31.5 39 32 L39 42 C39 44.5 37 46 34.5 46 L29.5 46 C27 46 25 44.5 25 42 Z" 
        fill="url(#vialGrad)" />

  <!-- Medical Cross / Plus Emblem on Vial -->
  <rect x="30" y="34" width="4" height="8" rx="1" fill="#ffffff" />
  <rect x="28" y="36" width="8" height="4" rx="1" fill="#ffffff" />

  <!-- Cold-chain Snowflake Sparkles -->
  <circle cx="19" cy="24" r="1.5" fill="#e7f8f7" />
  <circle cx="45" cy="24" r="1.5" fill="#e7f8f7" />
  <path d="M19 21 L19 27 M16 24 L22 24" stroke="#e7f8f7" stroke-width="1" stroke-linecap="round" />
  <path d="M45 21 L45 27 M42 24 L48 24" stroke="#e7f8f7" stroke-width="1" stroke-linecap="round" />
</svg>
