<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>VaxPass | Cold-Chain Vaccine Passport</title>
  <meta name="description" content="Blockchain-based cold-chain vaccine passport, temperature excursion management, and privacy-preserving administration on Ethereum.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0c4a6e">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#071b28">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="patient-receipt.js"></script>
  <script src="hardware-enclave.js"></script>
  <script src="gs1-parser.js"></script>
  <script src="account-abstraction.js"></script>
  <script src="graphql-client.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="VaxPass Homepage">
      <svg class="brand-logo" viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0c4a6e"/>
        <path d="M16 6 C21 6 25 8.5 25 11 C25 20 20 25 16 27 C12 25 7 20 7 11 C7 8.5 11 6 16 6 Z" fill="#0f9b9d" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
        <path d="M16 11 V21 M11 16 H21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="1.5" fill="#e7f8f7"/>
      </svg>
      <span class="brand-text"><span>Vax</span>Pass</span>
    </a>
    
    <button id="menuButton" class="icon-button" aria-label="Toggle navigation menu">
      <i class="hgi-stroke hgi-menu-01" aria-hidden="true"></i>
    </button>

    <nav id="nav">
      <a href="#/"><i class="hgi-stroke hgi-home-01" aria-hidden="true"></i><span>Home</span></a>
      <a href="#/register"><i class="hgi-stroke hgi-user-add-01" aria-hidden="true"></i><span>Register</span></a>
      <a href="#/manufacturer"><i class="hgi-stroke hgi-factory" aria-hidden="true"></i><span>Manufacturer</span></a>
      <a href="#/distributor"><i class="hgi-stroke hgi-truck-delivery" aria-hidden="true"></i><span>Distributor</span></a>
      <a href="#/clinic"><i class="hgi-stroke hgi-hospital-01" aria-hidden="true"></i><span>Clinic</span></a>
      <a href="#/regulator"><i class="hgi-stroke hgi-shield-user" aria-hidden="true"></i><span>Regulator</span></a>
      <a href="#/sensor"><i class="hgi-stroke hgi-thermometer-cold" aria-hidden="true"></i><span>Sensor</span></a>
      <a href="#/verify"><i class="hgi-stroke hgi-qr-code" aria-hidden="true"></i><span>Verify</span></a>
      <a href="#/analytics"><i class="hgi-stroke hgi-analytics-01" aria-hidden="true"></i><span>Analytics</span></a>
    </nav>

    <div class="topbar-actions">
      <div id="gaslessBadge" class="paymaster-chip" title="ERC-4337 Gas Sponsorship Active">
        <i class="hgi-stroke hgi-flash" aria-hidden="true"></i>
        <span>Gasless (4337)</span>
      </div>
      <div id="indexerBadge" class="indexer-chip fallback" title="GraphQL Subgraph / Indexer Status">
        <i class="hgi-stroke hgi-server-03" aria-hidden="true"></i>
        <span id="indexerStatusText">RPC Indexing</span>
      </div>
      <div id="networkChip" class="network-chip" title="Active blockchain network">
        <span class="network-dot"></span>
        <span id="networkName">Connecting…</span>
      </div>
      <button id="connectButton" class="wallet">
        <i class="hgi-stroke hgi-fingerprint" aria-hidden="true"></i>
        <span>Sign in</span>
      </button>
    </div>
  </header>

  <main id="app">
    <div class="skeleton-container" aria-label="Loading VaxPass">
      <div class="skeleton-hero"></div>
      <div class="skeleton-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <!-- Custom Popup Modal Container -->
  <div id="modalContainer" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true"></div>

  <!-- Sliding Transaction Drawer -->
  <aside id="txDrawer" class="tx-drawer" aria-live="polite"></aside>

  <!-- Smart Contract Safety Shield Alert -->
  <div id="shieldArea" aria-live="assertive"></div>

  <!-- Toast Notifications -->
  <div id="toastArea" class="toast-area" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
